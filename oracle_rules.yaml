meta:
  app: com.phbid_darat.supir.stg
  version: 2
  # v2 (14 Agu 2026) ditulis ULANG di atas bukti, bukan tebakan. Sumbernya:
  #   - 94.906 string DEX dari APK terpasang di Galaxy A52 (v2.1.1-stg)
  #   - dump UI asli layar Registrasi (tests/fixtures/registrasi.xml)
  #   - skema tabel profile_cache di DB internal aplikasi
  # Setiap aturan di bawah ini punya jejak ke salah satu dari tiga sumber itu.
  # Kalau tidak ada buktinya, aturannya TIDAK ditulis — lihat catatan `sim_number`.

# ---------------------------------------------------------------
# ORACLE IMPLISIT
# Aktif untuk SELURUH langkah pengujian tanpa perlu dideklarasikan per layar.
#
# KENAPA BERBASIS UI, BUKAN LOG JARINGAN:
# build ini release — log HTTP sudah di-strip; tidak ada satu pun baris
# request/response di logcat. Satu-satunya kanal tempat status server terlihat
# adalah toast di layar (format string `Gagal: ` + kode). Karena itu oracle
# implisit membaca UI tree, dan logcat diturunkan perannya jadi pendeteksi
# crash saja.
#
# Toast di app ini hidup ~2 detik, jadi pembacaannya harus lewat
# uitree.observe() (polling 0,35 s), bukan sekali dump setelah sleep.
#
# Urutan pemeriksaan: ui_expected → ui_environment → ui_forbidden.
# Yang pertama cocok menang, jadi allowlist selalu mengalahkan pola cacat.
# ---------------------------------------------------------------
implicit:

  # --- ALLOWLIST: pesan yang membuktikan app BEKERJA BENAR ----------
  # Tanpa daftar ini setiap uji nilai batas akan dilaporkan sebagai cacat,
  # padahal penolakan input memang hasil yang diharapkan.
  ui_expected:
    - id: validasi_form
      menandakan: penolakan
      note: >-
        validasi input — justru bukti app menolak nilai salah.
        `menandakan: penolakan` dibaca oleh formtest.classify(): hanya grup
        INI yang boleh disimpulkan sebagai "nilai ditolak". Empty state dan
        pesan izin di bawah juga `ui_expected`, tapi tidak mengatakan apa pun
        tentang nilai yang baru diketik.
      patterns:
        - "^Nomor KTP harus 16 digit$"
        - "^Nomor KTP tidak boleh kosong$"
        - "^Nomor SIM tidak boleh kosong$"
        - "^Nomor WhatsApp tidak (boleh kosong|valid)$"
        - "^Nama tidak boleh kosong$"
        - "^Alamat tidak boleh kosong$"
        - "^Tanggal berlaku SIM belum dipilih$"
        - "^Foto wajib untuk tahap ini$"
        - "^(No\\. Resi Belum Diisi|Nomor resi belum diisi|resi belum diisi)$"
        - "^Kode tidak sesuai\\. Periksa kembali\\.$"
        - "^Format nomor tidak valid\\. Periksa kembali\\.$"
        - "^Data tidak valid\\. Periksa kembali\\.$"

    - id: login_nomor_tak_terdaftar
      menandakan: penolakan
      note: >-
        Dialog MODAL, bukan toast — perilaku baru v2.2.0-stg, diverifikasi
        16 Agu 2026 dengan login sungguhan di Galaxy A52s (nomor uji
        081234567890): submit "Masuk" dengan nomor tak terdaftar / belum
        ditugaskan memunculkan dialog "Nomor Belum Terdaftar" yang MENETAP
        sampai tombol "Mengerti" ditekan. Dua konsekuensi untuk harness:
        (1) observe() pasti menangkapnya, tidak bergantung jendela toast;
        (2) sesudah dinilai, dialog wajib ditutup lewat "Mengerti" — kalau
        tidak, aksi berikutnya menekan dialog ini, bukan layar login.
      patterns:
        - "^Nomor Belum Terdaftar$"
        - "^Nomor WhatsApp ini belum terdaftar karena belum ada tugas yang diberikan\\. Silakan hubungi admin perusahaan Anda\\.$"

    - id: empty_state
      note: "layar kosong yang sah — bukan kegagalan memuat"
      patterns:
        - "^Belum Ada Notifikasi$"
        - "^Belum ada penugasan$"
        - "^Saat ini anda belum memiliki tugas aktif$"
        - "^Penugasan ini (sudah selesai\\.|telah selesai)$"

    - id: izin_dan_konfirmasi
      note: "permintaan izin & konfirmasi, perilaku normal"
      patterns:
        - "^Izin kamera diperlukan untuk scan QR code / barcode\\.$"
        - "^Aktifkan izin notifikasi terlebih dahulu untuk mengatur preferensi ini\\.$"
        - "^Tekan sekali lagi untuk keluar$"
        - "^Profil sudah pernah dilengkapi\\.$"

    - id: sukses
      menandakan: keberhasilan
      note: "konfirmasi keberhasilan; `Notifikasi terkirim!` adalah PASS Test Push"
      patterns:
        - "^Notifikasi terkirim!$"
        - "^Data berhasil disinkronkan$"
        - "^Semua data sudah tersinkron$"
        - "^Tersimpan, (akan dikirim saat online|sedang disinkronkan)$"

  # --- LINGKUNGAN: bukan cacat app, tapi menodai hasil uji ---------
  # Dilaporkan terpisah dengan severity `info`: kalau ini muncul, langkah
  # ujinya tidak sah dan harus diulang saat jaringan sehat — bukan bug.
  ui_environment:
    - id: offline
      severity: info
      patterns:
        - "^Tidak ada koneksi internet$"
        - "^Anda sedang offline$"
        - "^Terdapat masalah koneksi internet anda\\.$"
        - "^Koneksi gagal\\. Periksa jaringan Anda\\.$"
        - "^Menunggu jaringan\\.\\.\\.$"
        - "^Data belum tersedia offline\\. Coba lagi saat terhubung internet\\.$"
        - "^Data belum terkirim$"
        - "^Nyalakan GPS untuk menyimpan data$"

    - id: maintenance
      severity: info
      note: "server sengaja dimatikan; hentikan run, hasilnya tidak bermakna"
      patterns:
        - "^Sedang dalam Perbaikan$"
        - "pemeliharaan sistem"

  # --- POLA CACAT: kegagalan teknis yang sampai ke mata pengguna ----
  ui_forbidden:
    - id: gagal_kode_status
      pattern: "^Gagal:\\s*(\\d{3})\\b"
      severity: high
      note: >-
        format string `Gagal: ` + kode status. INI kanal satu-satunya status
        HTTP di build release. Bug 14 Agu "Test Push 403" muncul persis begini
        ("Gagal: 403"); aturan lama `HTTP (4xx|5xx)` tidak akan cocok karena
        tidak ada literal "HTTP" di teks toast-nya.

    - id: gagal_memuat
      pattern: "^Gagal memuat\\b|^Tidak Dapat Memuat$"
      severity: high
      note: "Gagal memuat data/profil/detail penugasan/QR Code/penugasan"

    - id: gagal_menulis
      pattern: "^Gagal (menyimpan|mengirim|memproses|menyiapkan)\\b"
      severity: high
      note: "aksi tulis gagal — data pengguna berpotensi hilang"

    - id: gagal_sinkron
      pattern: "^Gagal Sinkron$|^Sinkronisasi gagal"
      severity: high

    - id: tidak_terkirim
      pattern: "^Tidak terkirim:|^PERMANENT_FAIL"
      severity: high

    - id: respons_tidak_valid
      pattern: "^Respons server tidak valid$|^Server error:"
      severity: critical
      note: "kontrak API pecah — client tidak bisa membaca respons server"

    - id: pendaftaran_gagal
      pattern: "^Pendaftaran gagal"
      severity: high

    - id: permintaan_ditolak
      pattern: "^Permintaan ditolak\\. Coba lagi dalam beberapa menit\\.$"
      severity: high
      note: "penolakan sisi server tanpa sebab yang bisa dilihat pengguna"

    - id: rate_limit
      pattern: "^Terlalu banyak permintaan"
      severity: medium
      note: "sah dari sisi server, tapi kalau muncul di pemakaian normal berarti client terlalu cerewet"

    - id: gambar_hilang
      pattern: "^Gambar tidak ditemukan untuk salah satu update\\. Silakan ulangi\\.$"
      severity: high
      note: "file lampiran lenyap antara dipilih dan dikirim"

    - id: sesi_terputus
      pattern: "^Sesi Berakhir$|^Kamu telah logout karena login di perangkat lain|^Akun tidak ditemukan\\.$"
      severity: high
      kind: session
      note: "sesi mati di tengah run — sisa langkah setelah ini tidak sah, hentikan"

  # --- LOGCAT: HANYA crash ------------------------------------------
  # Aturan lama (NullPointerException, SQLiteException, HTTP 4xx/5xx) dibuang:
  # logcat di HP ini bercampur seluruh sistem, dan tanpa filter PID ketiganya
  # memanen baris milik app lain. Yang tersisa adalah sinyal yang tidak
  # mungkin salah baca. Saring per PID aplikasi sebelum dipanggil.
  logcat_crash:
    - id: fatal_exception
      pattern: "FATAL EXCEPTION"
      severity: critical
    - id: anr
      pattern: "ANR in "
      severity: critical
    - id: native_crash
      pattern: "signal \\d+ \\(SIG[A-Z]+\\)"
      severity: critical
    - id: process_died
      pattern: "Process com\\.phbid_darat\\.supir\\.stg .* has died"
      severity: critical

  # --- LOGCAT: kebocoran kredensial ---------------------------------
  # Menggantikan invariant `no_credential_in_log` yang lama. App ini tidak
  # punya password — kredensialnya adalah nomor WhatsApp + Kode Akses 6 digit
  # (endpoint auth/request-pin & auth/verify-pin).
  # Nomor asli TIDAK ditulis di repo. Isi lewat env var QA_PHONE saat run.
  #
  # DIVERIFIKASI 14 Agu 2026 dengan login sungguhan (logout → request-pin →
  # verify-pin → Registrasi, 15.289 baris logcat): app TIDAK membocorkan
  # apa pun. Nol kemunculan nomor maupun kode di baris milik aplikasi.
  #
  # Satu-satunya kebocoran datang dari tag `adbd`, dan itu ulah harness:
  # `adb shell input text <nilai>` membuat adbd mencatat perintahnya utuh —
  #     adbd: adbd service requested 'shell,v2,...,raw:input text 085…'
  # Dua akibatnya: (1) saring logcat per PID aplikasi sebelum memanggil
  # scan_logcat, kalau tidak harness sendiri yang tertuduh; (2) adapter
  # Tahap 3 harus mengetik lewat endpoint element/value Appium, bukan
  # `adb shell input text`, supaya nilai uji tidak ikut tercecer di log.
  logcat_secret:
    - id: kode_akses_bocor
      pattern: "(?i)(kode|pin|otp|code)[^0-9]{0,12}\\b\\d{6}\\b"
      severity: critical
      note: "Kode Akses 6 digit tidak boleh pernah muncul di logcat"
    - id: nomor_wa_bocor
      from_env: QA_PHONE
      severity: high
      note: "nomor WhatsApp = identitas login; pola diisi dari env, bukan dari repo"

# ---------------------------------------------------------------
# ORACLE EKSPLISIT — SPESIFIKASI FIELD
# type: numeric | alphanumeric | text | date | phone
#
# `label` menggantikan `selector`: aplikasi ini merender field sebagai
# android.view.View tanpa resource-id, dengan TextView label terpisah di
# atasnya (lihat tests/fixtures/registrasi.xml — keenam field tanpa id dan
# tanpa hint). Selector berbasis id mustahil di sini.
#
# Label ditulis TANPA tanda `*`; di UI tanda wajib menyatu dalam satu TextView
# ('Nomor KTP *'), jadi pencocokan harus menormalkan akhiran itu — dan
# kehadirannya sekaligus penanda `required` yang bisa dibaca langsung dari UI.
# ---------------------------------------------------------------
fields:
  ktp:
    label: "Nomor KTP"
    contoh_valid: "3273010101900001"   # placeholder: "Contoh: 3273 0101 0190 0001 (16 digit)"
    type: numeric
    length:
      exact: 16
    required: true
    note: >-
      16 bukan tebakan: string validasi harfiah "Nomor KTP harus 16 digit" ada
      di DEX. Justru itu mempertajam bug 14 Agu — data tersimpan 19 digit,
      jadi aturannya ada di kode tapi tidak ditegakkan di jalur penyimpanan.

  sim_number:
    label: "Nomor SIM"
    contoh_valid: "1301012345678"      # placeholder: "Contoh: 1301012345678"
    type: numeric
    required: true
    note: >-
      TIDAK ADA aturan panjang di sini karena tidak ada di aplikasi — satu-satunya
      validasi SIM di seluruh APK adalah "Nomor SIM tidak boleh kosong".
      Tiga angka yang beredar saling bertentangan (YAML v1 menebak 12,
      placeholder "Contoh: 1301012345678" 13 digit, data tersimpan 11 digit).
      TEMUAN UNTUK PRODUK: nomor SIM tidak divalidasi panjangnya sama sekali.

  sim_expiry:
    label: "Akhir Berlaku SIM"
    contoh_valid: "31/12/2027"         # placeholder: "Contoh: 31/12/2027"
    type: date
    format: "%d/%m/%Y"
    must_be_future: true
    required: true
    note: >-
      Label & format dari dump asli: placeholder "Contoh: 31/12/2027", garis
      miring — bukan "%d-%m-%Y". `must_be_future` adalah EKSPEKTASI, bukan
      aturan yang sudah ada: satu-satunya validasi tanggal di APK adalah
      "Tanggal berlaku SIM belum dipilih". Itu persis bug 14 Agu (SIM
      kedaluwarsa tetap diterima).

  nama:
    label: "Nama Sopir"
    contoh_valid: "Budi Santoso"       # placeholder: "Contoh: Budi Santoso"
    type: text
    required: true
    note: >-
      Label diperbaiki dari "Nama lengkap" (karangan v1). Batas min 3/max 50
      dibuang: tidak ada dasarnya di kode, hanya "Nama tidak boleh kosong".

  whatsapp:
    label: "Nomor WhatsApp"
    type: phone
    required: true
    note: >-
      Dulu bernama `telepon`. Ini identitas login (endpoint auth/request-pin),
      bukan nomor kontak biasa. `prefix_allowed` v1 (08/+628) dibuang: data
      tersimpan di dump asli berformat "6285155070869" — tanpa 0 dan tanpa +.
      Aturan prefix yang benar belum diketahui; jangan dikarang.

  alamat:
    label: "Alamat"
    contoh_valid: "Jl. Perjuangan No. 12, RT 03/RW 05, Surabaya"
    type: text
    required: true
    note: "hilang dari v1 padahal wajib (bertanda * di form) dan ada di DB (kolom address)"

# ---------------------------------------------------------------
# ORACLE EKSPLISIT — INVARIANT LAYAR
#
# Field `activity` DIBUANG: manifest hanya punya satu activity aplikasi
# (com.phbid_darat.supir.MainActivity). Semua "layar" adalah view di dalamnya,
# jadi layar dikenali dari teks yang tampak (`identified_by`), bukan activity.
#
# `observed` yang masuk ke check_screen berkunci LABEL, bukan resource-id.
# ---------------------------------------------------------------
screens:
  login:
    identified_by: ["Selamat Datang!", "Login dengan nomor WhatsApp Anda"]
    note: >-
      Kedua teks dari dump asli layar login v2.2.0-stg (16 Agu 2026, A52s).
      Tanpa entri ini classify() buta terhadap perpindahan layar saat menguji
      login. Sengaja tanpa invariant: belum ada yang terverifikasi di layar ini.

  registrasi:
    identified_by: ["Registrasi", "Nomor KTP"]
    invariants:
      - id: field_wajib_lengkap
        type: min_count
        label: "Nomor KTP"
        value: 1

  profil_saya:
    identified_by: ["Profil Saya", "Nomor KTP"]
    invariants:
      - id: profil_terisi
        type: min_count
        label: "Nomor KTP"
        value: 1

  detail_penugasan:
    identified_by: ["ID Order", "Pengirim"]
    invariants:
      - id: no_duplicate_sender
        type: unique_parts
        separator: ", "
        label: "Pengirim"
        note: >-
          bug 14 Agu: pengirim duplikat. Bentuknya BUKAN dua node terpisah —
          dump aslinya satu TextView berisi
          'PT. Ternak Ikan Buntal (IK), PT. Ternak Ikan Buntal (IK)' (56
          karakter). `unique_list` v1/v2-awal karena itu tidak akan pernah
          menangkapnya; yang benar adalah memecah nilai lalu mencari bagian
          berulang.

      - id: sender_not_empty
        type: min_count
        label: "Pengirim"
        value: 1

# Invariant `password_masked` DIHAPUS atas keputusan 14 Agu: app tidak punya
# password, dan Kode Akses yang tampil terbuka di 6 kotak adalah pola lazim
# untuk OTP — bukan cacat. `no_credential_in_log` pindah ke implicit.logcat_secret.

# ---------------------------------------------------------------
# AKSI TERLARANG — blacklist untuk crawler
# Daftar v1 hampir seluruhnya meleset ("Logout", "Hapus", "Bayar" tidak ada
# sebagai string di APK ini). Daftar di bawah diambil dari string DEX nyata.
# ---------------------------------------------------------------
crawler:
  forbidden_text:
    - "Keluar Akun"          # Profil → Lihat Profil Saya; ini logout sebenarnya
    - "Keluar dari akun"
    - "Berangkat Muat"       # memajukan status order di server, tak bisa dibatalkan
    - "Simpan"               # menyimpan perubahan tahap/profil
    - "Lapor"                # membuat record Laporan Kendala
    - "Tandai Sudah Dibaca"  # mengubah state notifikasi
    # Tiga di bawah ini tambahan dari saya, bukan dari daftar 14 Agu.
    # Alasannya sama beratnya: endpoint auth/login-approval/respond, dan
    # string app-nya sendiri berbunyi "Jika disetujui, akun akan keluar dari
    # perangkat yang sedang dipakai" — menekannya = logout perangkat uji.
    - "Setujui"
    - "Ya, ini saya"
    - "Tolak"
  forbidden_ids: []          # app ini nyaris tanpa resource-id; jangan andalkan id
  max_depth: 12
  max_steps: 300
